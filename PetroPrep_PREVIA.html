<script>
/* PetroPrep Cloud — autenticação, sincronização e painel de acompanhamento.
   Somente configuração PÚBLICA no navegador. Banco protegido por RLS (schema.sql). */
(() => {
  'use strict';
  const cfg=window.PETROPREP_CONFIG||{};
  const enabled=/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(String(cfg.url||'')) &&
    typeof cfg.publishableKey==='string' && cfg.publishableKey.length>20;
  const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let db=null, bridge=null, user=null, admin=false, timer=null, syncing=Promise.resolve(), initToken=0;
  let overlay=null, adminRows=[], adminProfiles=[];
  const genId=()=>window.crypto?.randomUUID?.()||'00000000-0000-4000-8000-'+Math.random().toString(16).slice(2).padEnd(12,'0').slice(0,12);
  const unique=a=>[...new Set((a||[]))];
  const mergeObjects=(a,b)=>[...new Map([...(a||[]),...(b||[])].filter(x=>x&&x.id).map(x=>[x.id,x])).values()];
  const status=t=>{const e=document.querySelector('#cloudAccountText');if(e)e.textContent=t};
  const notify=t=>bridge?.notify(t);
  const currentState=()=>bridge?.getState();
  const isAuthenticated=()=>Boolean(user);
  function setOverlay(html,wide=false){
    if(!overlay){overlay=document.createElement('div');overlay.className='cloud-overlay';document.body.appendChild(overlay)}
    overlay.innerHTML=`<section class="cloud-panel ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="Conta PetroPrep">${html}</section>`;
  }
  function closeOverlay(){overlay?.remove();overlay=null}
  const title=(h,desc)=>`<div class="cloud-headrow"><div><h2 class="cloud-heading">${h}</h2><p class="cloud-muted">${desc}</p></div><button type="button" class="cloud-close" data-cloud="close" aria-label="Fechar">×</button></div>`;
  const message=(msg,isError=false)=>`<p class="${isError?'cloud-error':'cloud-good'}" role="status">${escape(msg)}</p>`;
  function showLogin(which='login',msg='',error=false){
    const register=which==='register';
    setOverlay(`${title(register?'Criar minha conta':'Entrar no PetroPrep','Suas respostas e aulas sincronizadas entre computador e celular.')}
    ${msg?message(msg,error):''}
    <div class="cloud-actions" style="margin:2px 0 18px"><button class="btn ${register?'outline':'secondary'} small" data-cloud="login-tab">Entrar</button><button class="btn ${register?'secondary':'outline'} small" data-cloud="register-tab">Cadastrar</button></div>
    <form id="cloudAuthForm">
      ${register?'<label class="cloud-field">Nome<input name="name" type="text" maxlength="80" autocomplete="name" placeholder="Como quer aparecer no painel" required></label>':''}
      <label class="cloud-field">E-mail<input name="email" type="email" autocomplete="email" required placeholder="voce@exemplo.com"></label>
      <label class="cloud-field">Senha<input name="password" type="password" minlength="6" autocomplete="${register?'new-password':'current-password'}" required placeholder="Mínimo de 6 caracteres"></label>
      <button class="btn" type="submit" style="width:100%">${register?'Criar conta':'Entrar'} →</button>
    </form>
    <div class="cloud-actions"><button class="cloud-link" data-cloud="reset-password">Esqueci minha senha</button><button class="cloud-link" data-cloud="close">Continuar sem conta (salva só neste navegador)</button></div>
    <div class="cloud-top-note">Os dados dos estudantes ficam privados. Só a conta marcada como administradora pode acompanhar os resultados das outras pessoas.</div>`);
    overlay.querySelector('#cloudAuthForm').dataset.mode=register?'register':'login';
  }
  function showAccount(){
    if(!enabled){setOverlay(`${title('Modo local','O site funciona sem banco de dados, mas não sincroniza.')}${message('Para habilitar o login, configure config.js com a URL e a chave pública do seu projeto Supabase.')}`);return}
    if(!user){showLogin();return}
    setOverlay(`${title('Minha conta','Sincronização com o banco de dados ativa.')}
    <div class="cloud-badge">✓ ${escape(user.email||'Conta conectada')}</div>
    <p class="cloud-muted" style="margin-top:15px">Cada resposta tem seu próprio registro, com data, questão e resultado. Seu painel pessoal mostra os seus dados.</p>
    <div class="cloud-actions"><button class="btn secondary small" data-cloud="sync">Sincronizar agora</button>${admin?'<button class="btn small" data-cloud="admin">Painel de alunos ↗</button>':''}${localStorage.getItem('petroprep_estado_v1')?'<button class="btn outline small" data-cloud="import-old">Importar progresso antigo</button>':''}<button class="btn outline small" data-cloud="logout">Sair da conta</button></div>
    <p class="cloud-top-note">O histórico não é apagado ao sair. Em um novo dispositivo, entre com a mesma conta.</p>`);
  }
  async function authSubmit(e){
    e.preventDefault(); const form=e.target;const v=Object.fromEntries(new FormData(form));const btn=form.querySelector('button[type="submit"]');
    btn.disabled=true;btn.textContent='Conectando…';
    try{
      if(form.dataset.mode==='register'){
        const {data,error}=await db.auth.signUp({email:v.email.trim(),password:v.password,options:{data:{display_name:v.name.trim()},emailRedirectTo:location.origin+location.pathname}});
        if(error)throw error;
        if(data.session){closeOverlay();notify('Conta criada e conectada!')}
        else showLogin('login','Cadastro recebido. Confira seu e-mail e confirme a conta antes de entrar.');
      } else {
        const {error}=await db.auth.signInWithPassword({email:v.email.trim(),password:v.password});
        if(error)throw error;
        closeOverlay();notify('Login efetuado. Carregando seu histórico…');
      }
    }catch(e){showLogin(form.dataset.mode==='register'?'register':'login',e.message||'Falha ao entrar.',true)}
  }
  async function resetPassword(){
    const email=overlay?.querySelector('input[name="email"]')?.value.trim();
    if(!email){showLogin('login','Digite seu e-mail no formulário e clique novamente em "Esqueci minha senha".',true);return}
    const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    showLogin('login',error?.message||'Se a conta existir, você receberá um e-mail com instruções.',Boolean(error));
  }
  function rowsToHistory(rows){return rows.map(x=>({id:x.question_id,attemptId:x.id,answer:x.answer,correct:x.correct,date:x.answered_at,mode:x.mode}))}
  async function getAll(table,columns,filterUser=null){
    const result=[];
    for(let offset=0;offset<50000;offset+=1000){
      let query=db.from(table).select(columns).range(offset,offset+999);
      if(filterUser)query=query.eq('user_id',filterUser);
      if(table==='question_attempts')query=query.order('answered_at',{ascending:true});
      const {data,error}=await query;
      if(error)throw error;
      result.push(...data);
      if(data.length<1000)break;
    }
    return result;
  }
  function mergeState(local,remote,attempts){
    const rs=remote||{}, merged={...bridge.initial(),...local};
    merged.read=unique([...(rs.read_topics||[]),...(local.read||[])]);
    merged.bookmark=unique([...(rs.bookmarks||[]),...(local.bookmark||[])]);
    merged.weeks=unique([...(rs.finished_weeks||[]),...(local.weeks||[])]);
    merged.customTopics=mergeObjects(rs.custom_topics,local.customTopics);
    merged.customQuestions=mergeObjects(rs.custom_questions,local.customQuestions);
    merged.theme=remote?.theme||local.theme||'light';
    const historyMap=new Map(rowsToHistory(attempts).map(x=>[x.attemptId,x]));
    for(const entry of (local.history||[])){
      if(!entry.attemptId)entry.attemptId=genId();
      if(!historyMap.has(entry.attemptId))historyMap.set(entry.attemptId,entry);
    }
    merged.history=[...historyMap.values()].sort((a,b)=>String(a.date).localeCompare(String(b.date))).slice(-5000);
    return merged;
  }
  async function saveSettings(){
    if(!user)return;
    const userId=user.id;
    const snapshot=currentState();
    const payload={user_id:userId,read_topics:snapshot.read,bookmarks:snapshot.bookmark,
      finished_weeks:snapshot.weeks,custom_topics:snapshot.customTopics,
      custom_questions:snapshot.customQuestions,theme:snapshot.theme,updated_at:new Date().toISOString()};
    syncing=syncing.catch(()=>{}).then(async()=>{
      if(user?.id!==userId)return;
      const {error}=await db.from('user_settings').upsert(payload,{onConflict:'user_id'});
      if(error)throw error;
    });
    try{await syncing}catch(e){notify('Alteração salva no navegador; não foi possível sincronizar as preferências.')}
  }
  function persist(){if(!user)return;clearTimeout(timer);timer=setTimeout(saveSettings,650)}
  async function resetAnswers(){
    if(!user)return;
    const userId=user.id;
    const {error}=await db.from('question_attempts').delete().eq('user_id',userId);
    if(error)notify('Progresso zerado localmente, mas não foi possível apagar o histórico na nuvem: '+error.message);
    else notify('Histórico de respostas também apagado da nuvem.');
  }
  async function syncAttempts(){
    if(!user)return;
    const userId=user.id;const all=currentState()?.history||[];
    const batches=[];
    for(const item of all){
      if(!item.attemptId)continue;
      batches.push({id:item.attemptId,user_id:userId,question_id:item.id,answer:item.answer,
        correct:item.correct,mode:item.mode||'practice',answered_at:item.date||new Date().toISOString()});
    }
    for(let offset=0;offset<batches.length;offset+=200){
      if(user?.id!==userId)return;
      const {error}=await db.from('question_attempts').upsert(batches.slice(offset,offset+200),{onConflict:'id',ignoreDuplicates:true});
      if(error)throw error;
    }
  }
  async function trackAnswer(item){
    if(!user)return;
    const userId=user.id;
    const {error}=await db.from('question_attempts').upsert({id:item.attemptId,user_id:userId,question_id:item.id,
      answer:item.answer,correct:item.correct,mode:item.mode,answered_at:item.date},
      {onConflict:'id',ignoreDuplicates:true});
    if(error)notify('Resposta salva no navegador. Falha na nuvem; tente “Sincronizar agora”.');
  }
  async function loadSession(session){
    const token=++initToken; clearTimeout(timer);
    const id=session?.user?.id||null;
    if(id===user?.id && id!==null)return;
    if(!id){
      user=null;admin=false;bridge.setStorageKey('petroprep_local_visitante_v2');
      bridge.applyState(bridge.getLocalState());status('Entrar');
      if(enabled)showLogin();return;
    }
    const newUser=session.user;
    user=newUser;admin=false;status('Carregando…');
    bridge.setStorageKey(`petroprep_user_${newUser.id}_v2`);
    const local=bridge.getLocalState();
    bridge.applyState(local);
    try{
      const name=String(newUser.user_metadata?.display_name||newUser.email?.split('@')[0]||'Estudante').slice(0,80);
      const profilePromise=db.from('profiles').upsert({id:newUser.id,display_name:name,email:newUser.email||''},{onConflict:'id'});
      const [s,attempts,adminR,profileR]=await Promise.all([
        db.from('user_settings').select('*').eq('user_id',newUser.id).maybeSingle(),
        getAll('question_attempts','id,question_id,answer,correct,mode,answered_at',newUser.id),
        db.from('admin_users').select('user_id').eq('user_id',newUser.id).maybeSingle(),
        profilePromise
      ]);
      if(token!==initToken || user?.id!==newUser.id)return;
      if(s.error)throw s.error;
      if(adminR.error)throw adminR.error;
      if(profileR.error)throw profileR.error;
      admin=Boolean(adminR.data);
      const merged=mergeState(local,s.data,attempts);
      bridge.applyState(merged);
      localStorage.setItem(`petroprep_user_${newUser.id}_v2`,JSON.stringify(merged));
      status(newUser.user_metadata?.display_name||newUser.email?.split('@')[0]||'Minha conta');
      closeOverlay();
      await Promise.all([saveSettings(),syncAttempts()]);
    }catch(e){
      if(token!==initToken)return;
      status('Nuvem indisponível');
      notify(`Dados locais disponíveis, mas houve erro ao sincronizar: ${e.message||'tente novamente'}`);
    }
  }
  async function syncNow(){
    if(!user)return;
    setOverlay(`${title('Sincronização','Conferindo dados locais e da nuvem…')}<p class="cloud-muted">Processando histórico de questões.</p>`);
    try{
      const userId=user.id, local=currentState();
      const [s,attempts]=await Promise.all([
        db.from('user_settings').select('*').eq('user_id',userId).maybeSingle(),
        getAll('question_attempts','id,question_id,answer,correct,mode,answered_at',userId)
      ]);
      if(s.error)throw s.error;
      if(user?.id!==userId)return;
      bridge.applyState(mergeState(local,s.data,attempts));
      localStorage.setItem(`petroprep_user_${userId}_v2`,JSON.stringify(currentState()));
      await syncAttempts();await saveSettings();
      showAccount();notify('Sincronização concluída!');
    }catch(e){showAccount();notify('Falha na sincronização: '+e.message)}
  }
  function adminSummary(){
    const byUser=new Map();
    for(const r of adminRows){
      const obj=byUser.get(r.user_id)||{attempts:0,correct:0,wrong:0,last:null};
      obj.attempts++;
      if(r.correct===true)obj.correct++;
      if(r.correct===false)obj.wrong++;
      if(!obj.last||obj.last<r.answered_at)obj.last=r.answered_at;
      byUser.set(r.user_id,obj);
    }
    return adminProfiles.map(p=>({profile:p,...(byUser.get(p.id)||{attempts:0,correct:0,wrong:0,last:null})}));
  }
  async function showAdmin(){
    if(!user||!admin)return;
    setOverlay(`${title('Painel dos alunos','Carregando resultados individuais…')}<p class="cloud-muted">Os dados são visíveis somente para administradores.</p>`,true);
    try{
      const [p,rows]=await Promise.all([
        getAll('profiles','id,display_name,email,joined_at'),
        getAll('question_attempts','id,user_id,question_id,answer,correct,mode,answered_at')
      ]);
      adminRows=rows;adminProfiles=p;
      let people=adminSummary().sort((a,b)=>b.attempts-a.attempts);
      setOverlay(`${title('Painel dos alunos',`${people.length} contas · ${rows.length} tentativas registradas`)}
        <div class="cloud-scroll"><table class="cloud-table"><thead><tr><th>Aluno</th><th>Tentativas</th><th>Acertos</th><th>Erros</th><th>% de acerto</th><th>Última resposta</th></tr></thead><tbody>
        ${people.map(p=>`<tr class="selectable" data-cloud="student" data-student="${escape(p.profile.id)}"><td><strong>${escape(p.profile.display_name)}</strong><br>${escape(p.profile.email)}</td><td>${p.attempts}</td><td>${p.correct}</td><td>${p.wrong}</td><td>${p.correct+p.wrong?Math.round(p.correct/(p.correct+p.wrong)*100):'—'}</td><td>${p.last?new Date(p.last).toLocaleDateString('pt-BR'):'—'}</td></tr>`).join('')}
        </tbody></table></div><div class="cloud-actions"><button class="btn secondary small" data-cloud="export-csv">Exportar CSV</button><button class="btn outline small" data-cloud="account">Minha conta</button></div>`,true);
    }catch(e){setOverlay(`${title('Painel dos alunos','Não foi possível ler os registros.')}${message(e.message,true)}<button class="btn secondary" data-cloud="account">Voltar</button>`,true)}
  }
  function studentDetails(id){
    const p=adminProfiles.find(x=>x.id===id);if(!p)return;
    const list=adminRows.filter(x=>x.user_id===id).sort((a,b)=>String(b.answered_at).localeCompare(String(a.answered_at)));
    const contents=window.PetroPrep?.getContent().questions||[];
    const questionMap=new Map(contents.map(x=>[x.id,x]));
    setOverlay(`${title(escape(p.display_name),`${list.length} tentativas · ${escape(p.email)}`)}
      <div class="cloud-scroll"><table class="cloud-table"><thead><tr><th>Quando</th><th>Matéria / questão</th><th>Resposta</th><th>Resultado</th></tr></thead><tbody>
      ${list.slice(0,1000).map(r=>{const q=questionMap.get(r.question_id);return `<tr><td>${new Date(r.answered_at).toLocaleString('pt-BR')}</td><td><strong>${escape(r.question_id)}</strong> — ${escape(q?.text?.slice(0,90)||'Questão não disponível nesta versão')}</td><td>${r.answer===null?'Branco':r.answer?'Certo':'Errado'}</td><td class="cloud-check">${r.correct===null?'—':r.correct?'✓ Acerto':'✕ Erro'}</td></tr>`}).join('')}</tbody></table></div>
      <p class="cloud-top-note">Exibindo até 1.000 tentativas recentes. O CSV exporta o histórico completo carregado.</p>
      <div class="cloud-actions"><button class="btn secondary small" data-cloud="admin">← Voltar aos alunos</button></div>`,true);
  }
  function csvQuote(s){return '"'+String(s??'').replace(/"/g,'""')+'"'}
  function exportCsv(){
    const profiles=new Map(adminProfiles.map(x=>[x.id,x]));
    const rows=[['usuario','email','questao','resposta','resultado','modalidade','data'],...adminRows.map(r=>[
      profiles.get(r.user_id)?.display_name||'—',profiles.get(r.user_id)?.email||'—',r.question_id,
      r.answer===null?'Branco':r.answer?'Certo':'Errado',r.correct===null?'Branco':r.correct?'Acerto':'Erro',r.mode,r.answered_at
    ])];
    const csv='\ufeff'+rows.map(x=>x.map(csvQuote).join(';')).join('\r\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    const a=document.createElement('a');a.href=url;a.download='petroprep-atividade-alunos.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  async function signOut(){
    clearTimeout(timer);
    if(user)await saveSettings();
    const {error}=await db.auth.signOut();
    if(error)notify(error.message);
    else{closeOverlay();notify('Você saiu da conta. Dados preservados na nuvem.')}
  }
  async function importOldProgress(){
    if(!user)return;
    let old;try{old=JSON.parse(localStorage.getItem('petroprep_estado_v1')||'null')}catch(e){notify('Backup anterior inválido.');return}
    if(!old||!Array.isArray(old.history)){notify('Não há progresso antigo compatível.');return}
    if(!confirm('Importar respostas e conteúdos do PetroPrep antigo para esta conta? O histórico atual será preservado.'))return;
    const local=currentState();
    const unified=mergeState({...local,
      read:unique([...(local.read||[]),...(old.read||[])]),
      bookmark:unique([...(local.bookmark||[]),...(old.bookmark||[])]),
      weeks:unique([...(local.weeks||[]),...(old.weeks||[])]),
      customTopics:mergeObjects(old.customTopics,local.customTopics),
      customQuestions:mergeObjects(old.customQuestions,local.customQuestions),
      history:[...(local.history||[]),...old.history.map(x=>({...x,attemptId:genId()}))]
    },null,[]);
    bridge.applyState(unified);
    localStorage.setItem(`petroprep_user_${user.id}_v2`,JSON.stringify(unified));
    try{await syncAttempts();await saveSettings();showAccount();notify('Progresso antigo importado!')}catch(e){notify('Importado localmente. Tente sincronizar mais tarde.')}
  }
  function clickOverlay(e){
    const button=e.target.closest('[data-cloud]');if(!button)return;
    const act=button.dataset.cloud;
    if(act==='close')closeOverlay();
    if(act==='login-tab')showLogin('login');
    if(act==='register-tab')showLogin('register');
    if(act==='reset-password')resetPassword();
    if(act==='logout')signOut();
    if(act==='sync')syncNow();
    if(act==='account')showAccount();
    if(act==='admin')showAdmin();
    if(act==='student')studentDetails(button.dataset.student);
    if(act==='export-csv')exportCsv();
    if(act==='import-old')importOldProgress();
  }
  function init(appBridge){
    bridge=appBridge;
    document.querySelector('#cloudAccount')?.addEventListener('click',showAccount);
    document.addEventListener('click',clickOverlay);
    document.addEventListener('submit',e=>{if(e.target.id==='cloudAuthForm')authSubmit(e)});
    if(!enabled){status('Modo local');return}
    if(!window.supabase?.createClient){status('Sem conexão');notify('Biblioteca de autenticação não carregou. Verifique sua internet.');return}
    db=window.supabase.createClient(cfg.url.replace(/\/$/,''),cfg.publishableKey);
    bridge.setStorageKey('petroprep_local_visitante_v2');
    bridge.applyState(bridge.getLocalState());
    status('Entrar');
    db.auth.onAuthStateChange((event,session)=>{
      if(['INITIAL_SESSION','SIGNED_IN','SIGNED_OUT'].includes(event))setTimeout(()=>loadSession(session),0);
    });
    db.auth.getSession().then(({data,error})=>{
      if(error){notify('Não foi possível recuperar a sessão.');showLogin()}
      else loadSession(data.session);
    });
    window.addEventListener('online',()=>{if(user){syncAttempts().then(()=>saveSettings()).catch(()=>{});}});
  }
  window.PetroCloud={init,isAuthenticated,persist,trackAnswer,resetAnswers,showAccount};
})();

</script>
<script>
/* PetroPrep — frontend com sincronização opcional via Supabase.
   Conteúdos-base em conteudo.js, dados individuais em PostgreSQL com RLS. */
(() => {
'use strict';
const BASE = window.PETRO_DATA;
if (!BASE) { document.querySelector('#main').textContent = 'Não foi possível carregar conteudo.js. Abra o index.html junto dos demais arquivos.'; return; }
const KEY = 'petroprep_estado_v1';
let storageKey=KEY;
const initial = {read:[],bookmark:[],weeks:[],history:[],customTopics:[],customQuestions:[],theme:'light'};
function loadState(){try{const x=JSON.parse(localStorage.getItem(storageKey)||'{}');return {...initial,...x}}catch(_){return {...initial}}}
let state=loadState(), current='dashboard', activeTopic=null, activeBlock='TODOS', searchText='', qTopic='TODOS', qDifficulty='TODOS', quiz=null, toastTimeout=null;
const main = document.getElementById('main');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr=esc;
const save=()=>{try{localStorage.setItem(storageKey,JSON.stringify(state))}catch(_){toast('Armazenamento local cheio. Exporte seu progresso para fazer uma cópia.')} window.PetroCloud?.persist(state)};
const topics=()=>[...BASE.topics,...state.customTopics];
const questions=()=>[...BASE.questions,...state.customQuestions];
const topicById=id=>topics().find(x=>x.id===id);
const questionTopic=(id)=>topicById(id)?.title || 'Matéria personalizada';
const blockLabel=b=>b==='BÁSICOS'?'Conhecimentos básicos':`Bloco ${b}`;
const topicQuestions=id=>questions().filter(x=>x.topic===id);
const lastAnswers=()=>{const a={};state.history.forEach(x=>{if(x.answer!==null)a[x.id]=x});return a};
const wrong=()=>{const a=lastAnswers();return questions().filter(q=>a[q.id]&&!a[q.id].correct)};
const answered=()=>state.history.filter(x=>x.answer!==null);
const accuracy=()=>{const a=answered();return a.length? Math.round(100*a.filter(x=>x.correct).length/a.length):0};
const examScore=arr=>arr.reduce((sum,x)=>sum+(x.answer===null?0:x.correct?1:-1),0);
const topicStudied=id=>state.read.includes(id) || !!state.history.find(x=>questions().find(q=>q.id===x.id)?.topic===id);
const covered=()=>topics().filter(x=>topicStudied(x.id)).length;
const escapeContent=x=>esc(x).replace(/\n/g,'<br>');
const getWeekNumber=()=>{let day=new Date(), anchor=new Date(2026,10,16), n=Math.floor((new Date(day.getFullYear(),day.getMonth(),day.getDate())-anchor)/604800000)+1;return Math.min(12,Math.max(1,n))};
function toast(msg){let x=$('.toast');if(x)x.remove();x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.append(x);clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>x.remove(),3000)}
function setTheme(){document.body.classList.toggle('dark',state.theme==='dark');const t=$('#themeToggle');if(t)t.textContent=state.theme==='dark'?'☼':'◐'}
function nav(view,topic){current=view;if(topic)activeTopic=topic;window.scrollTo({top:0,behavior:'instant'});document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===current));$('#sidebar').classList.remove('open');$('#mobileoverlay').classList.remove('show');render()}
function header(label,title,desc,aside=''){return `<div class="pagehead"><div><div class="eyebrow">${esc(label)}</div><h1 class="pageheading">${esc(title)}</h1><p class="subtitle">${esc(desc)}</p></div>${aside}</div>`}
function footer(){return `<div class="footerline">PetroPrep é um projeto de estudos independente, não afiliado à Petrobras ou ao Cebraspe. Conteúdo baseado no edital de 2021/2022; questões autorais. ${window.PetroCloud?.isAuthenticated()?'Seu progresso é sincronizado na nuvem.':'Seu progresso fica salvo neste navegador enquanto você não conectar uma conta.'} <a href="${attr(BASE.links.edital)}" target="_blank" rel="noopener noreferrer">Consultar edital oficial ↗</a></div>`}
function render(){
 const titles={dashboard:'Seu painel de aprendizagem',trilhas:'Matérias e aulas',lesson:'Aula e conteúdo',questoes:'Banco de questões',simulados:'Simulados',erros:'Caderno de erros',plano:'Plano de estudos',biblioteca:'Biblioteca',gerenciar:'Personalizar conteúdo',quiz:'Sessão de questões',resultados:'Resultado'};
 $('#breadcrumb').textContent=titles[current]||'PetroPrep';
 const views={dashboard:dashboard,trilhas:trilhas,lesson:lesson,questoes:questoes,simulados:simulados,erros:erros,plano:plano,biblioteca:biblioteca,gerenciar:gerenciar,quiz:quizView,resultados:resultsView};
 main.innerHTML=(views[current]||dashboard)()+footer();
 setTheme();
}
function dashboard(){
 const ac=accuracy(), tot=topics().length, done=covered(), numQ=questions().length;
 const nWeek=BASE.weeks[getWeekNumber()-1], recommended=(nWeek?.topics||[]).map(topicById).filter(Boolean).slice(0,3);
 if(!recommended.length)recommended.push(...topics().slice(0,3));
 return `<div class="hero"><div class="heroinside"><div class="herotag">✦ SEU ESPAÇO DE PREPARAÇÃO</div><h1>Seu próximo passo rumo à Petrobras começa aqui.</h1><p>Estude os tópicos do edital, pratique Certo ou Errado e transforme cada erro em aprendizado.</p><div class="herobuttons"><button class="btn" data-action="start-quick">▶ &nbsp;Praticar agora</button><button class="btn ghostwhite" data-view="trilhas">Explorar matérias ↗</button></div></div></div>
 <div class="stats">
 <div class="stat"><div class="stat-head">Questões resolvidas <span class="stat-icon">◎</span></div><div class="statvalue">${answered().length}</div><div class="statfoot">${numQ} questões no banco</div></div>
 <div class="stat"><div class="stat-head">Taxa de acerto <span class="stat-icon">◈</span></div><div class="statvalue">${ac}%</div><div class="statfoot">Respostas de todas as sessões</div></div>
 <div class="stat"><div class="stat-head">Matérias iniciadas <span class="stat-icon">▤</span></div><div class="statvalue">${done}<span style="font-size:15px;color:var(--muted)">/${tot}</span></div><div class="statfoot">Pelo menos uma aula ou questão</div></div>
 <div class="stat"><div class="stat-head">Pontuação líquida <span class="stat-icon">✳</span></div><div class="statvalue">${examScore(state.history)}</div><div class="statfoot">+1 acerto · −1 erro · 0 branco</div></div>
 </div>
 <div class="secrow"><h2 class="sectitle">Seu caminho de estudos</h2><button class="textlink" data-view="plano">Ver planejamento →</button></div>
 <div class="columns"><section class="panel"><div class="panelhead"><h3>Matérias para começar</h3><span class="chip">Semana ${getWeekNumber()}</span></div>${recommended.map(t=>`<div class="courseitem" data-action="open-topic" data-id="${attr(t.id)}"><div class="courseicon">${iconFor(t.block)}</div><div style="flex:1;min-width:0"><div class="ctitle">${esc(t.title)}</div><div class="cmeta">${esc(blockLabel(t.block))} · ${topicQuestions(t.id).length} questões</div></div><span class="arrow">↗</span></div>`).join('')}<div class="weekline"><div class="lab">No seu cronograma</div><strong>${esc(nWeek?.title||'Revisão geral')}</strong><p>${esc(nWeek?.range||'')}. Adapte livremente à sua rotina da faculdade.</p></div></section>
 <section class="panel"><div class="panelhead"><h3>Cobertura do edital</h3><span class="chip">${done} de ${tot}</span></div><div class="donut" style="--percent:${tot?Math.round(done/tot*100):0}%"><div class="donutinner"><strong>${tot?Math.round(done/tot*100):0}%</strong><small>explorado</small></div></div><div class="legend"><span>Conhecimentos básicos</span><strong>${topics().filter(t=>t.block==='BÁSICOS'&&topicStudied(t.id)).length}/${topics().filter(t=>t.block==='BÁSICOS').length}</strong></div><div class="legend"><span>Blocos específicos</span><strong>${topics().filter(t=>t.block!=='BÁSICOS'&&topicStudied(t.id)).length}/${topics().filter(t=>t.block!=='BÁSICOS').length}</strong></div><div class="progressbar"><div class="progressfill" style="width:${tot?Math.round(done/tot*100):0}%"></div></div><button class="btn secondary" style="width:100%;margin-top:19px" data-view="trilhas">Continuar estudando →</button></section></div>
 <div class="secrow"><h2 class="sectitle">Como você quer estudar hoje?</h2></div><div class="actioncards"><button class="actioncard" data-view="trilhas"><span class="bigemoji">📖</span><strong>Aprender uma matéria</strong><p>Resumos, fórmulas, exemplos e bibliografia técnica.</p></button><button class="actioncard" data-view="questoes"><span class="bigemoji">🎯</span><strong>Resolver questões</strong><p>Treino por tópico com correção e justificativa.</p></button><button class="actioncard" data-view="simulados"><span class="bigemoji">⏱</span><strong>Fazer simulado</strong><p>Questões misturadas, pontuação líquida e resultado.</p></button></div>`}
function iconFor(block){return {'I':'∑','II':'⚙','III':'◈','BÁSICOS':'Aa'}[block]||'✦'}
function trilhas(){const ss=searchText.toLowerCase();const filtered=topics().filter(t=>(activeBlock==='TODOS'||t.block===activeBlock)&&(`${t.title} ${t.summary}`.toLowerCase().includes(ss)));
 return header('Conteúdo programático','Matérias e aulas',`${topics().length} módulos organizados por blocos conforme o edital de Engenharia de Petróleo.`) + `<div class="filters"><label class="searchbox">⌕ <input id="topicSearch" placeholder="Buscar uma matéria ou assunto..." value="${attr(searchText)}" aria-label="Buscar matéria"/></label></div><div class="tabs">${[['TODOS','Todas'],['I','Bloco I'],['II','Bloco II'],['III','Bloco III'],['BÁSICOS','Português e Inglês']].map(([b,l])=>`<button class="tab ${activeBlock===b?'active':''}" data-action="filter-block" data-block="${b}">${l}</button>`).join('')}</div><div class="topics" id="topicsList">${topicCards(filtered)}</div>`;}
function topicCards(filtered){return filtered.length?filtered.map(t=>`<button class="topiccard" data-action="open-topic" data-id="${attr(t.id)}"><span class="topicbadge ${topicStudied(t.id)?'green':''}">${topicStudied(t.id)?'✓ INICIADO':esc(blockLabel(t.block).toUpperCase())}</span><h3>${esc(t.title)}</h3><p>${esc(t.summary).slice(0,150)}${t.summary.length>150?'…':''}</p><div class="topicfooter"><span>${topicQuestions(t.id).length} questões disponíveis</span><b>Estudar ↗</b></div></button>`).join(''):`<div class="empty" style="grid-column:1/-1">⌕<strong>Nenhuma matéria encontrada</strong><p>Tente outra palavra ou bloco.</p></div>`}
const EXTRA={
 fluidos:['Comece identificando se o fluido é compressível, se o regime é permanente e qual é o volume de controle. Essas hipóteses determinam quais equações são válidas.','Em continuidade para regime permanente: vazão mássica de entrada = vazão mássica de saída, na ausência de acúmulo. Em fluidos incompressíveis e um único tubo, A·V permanece constante.','Em Bernoulli, não esqueça: a forma idealizada relaciona pressão, velocidade e cota; máquinas e atrito exigem termos adicionais na equação de energia.'],
 termo:['Funções de estado, como U, H e S, independem do caminho. Calor e trabalho dependem da trajetória. Em ciclos, ΔU=0 e ΔS do sistema=0, mas isso não significa ausência de irreversibilidades.','Para resolver questões, declare o sistema, a convenção de sinais, os processos e as hipóteses; só depois escreva a primeira lei.','Na segunda lei, observe diferenças entre entropia do sistema e geração de entropia: S_gerada≥0 para processos reais.'],
 calor:['Condução: transporte associado ao gradiente térmico; modelo elementar de parede plana em regime permanente leva a q̇=kAΔT/L.','Convecção: envolve troca térmica entre superfície e fluido; q̇=hA(T_s−T∞).','Radiação: a dependência com a temperatura absoluta é da quarta potência, não linear.'],
 geo:['Sistema petrolífero convencional envolve geração e expulsão de hidrocarbonetos, migração, acumulação em rocha reservatório e retenção por selo e armadilha.','As propriedades petrofísicas da rocha não são inferidas diretamente de uma “foto” do subsolo. Geofísica mede respostas a estímulos; interpretações combinam geologia e dados de poços.','Na reflexão sísmica vertical simplificada, o tempo de ida e volta é t≈2z/v. Se a velocidade não é constante, a relação exige tratamento mais cuidadoso.'],
 perfuracao:['A lama circula por meio de bombas e remove cascalhos, ajuda no controle de pressão e influencia a estabilidade do poço.','A pressão hidrostática depende da densidade do fluido e da profundidade vertical (não simplesmente do comprimento da trajetória inclinada).','Perfuração direcional inclui trajetórias desviadas e horizontais; não é sinônimo de perfuração horizontal.'],
 reservatorios:['Porosidade representa espaço vazio relativo; permeabilidade representa facilidade de passagem do fluido. São propriedades diferentes.','A lei de Darcy é uma relação básica entre vazão, diferença de pressão, permeabilidade, geometria e viscosidade para condições de fluxo adequadas.','Testes de pressão ajudam a inferir propriedades do sistema poço-reservatório a partir da resposta de pressão e vazão.'],
 prob:['Para eventos independentes, P(A∩B)=P(A)P(B). Não assuma independência só porque dois eventos aparecem no enunciado.','A probabilidade condicional P(A|B) usa o universo restrito em que B ocorre; o denominador é P(B).','Use o teorema de Bayes quando o enunciado apresenta uma evidência e solicita a probabilidade de uma causa.'],
 resistencia:['Desenhe todas as forças, reações e seções de interesse antes de escrever as equações.','Tensão média axial N/A é válida como descrição simplificada de uma barra sob esforço axial; detalhes locais e concentrações de tensão exigem modelos adicionais.','A lei de Hooke vale no trecho linear elástico. Plásticos e estados multiaxiais demandam modelos mais elaborados.'],
 portugues:['Em Cebraspe, observe palavras restritivas: “sempre”, “somente”, “necessariamente” e “todos”. Elas podem tornar a afirmação incorreta.','Em interpretação, não confunda informação explicitamente dita, inferência lógica e opinião externa.','Na reescrita, analise simultaneamente correção gramatical e manutenção de sentido.'],
 ingles:['Leia a pergunta antes do texto, identifique palavras-chave e procure conectivos que mudam a relação lógica entre orações.','Although, even though e despite sinalizam concessão; therefore indica consequência; however indica contraste.','Uma questão de compreensão pode exigir inferência, sem tradução palavra por palavra.']
};
function lesson(){let t=topicById(activeTopic)||topics()[0];if(!t)return '<p>Sem conteúdos disponíveis.</p>';activeTopic=t.id;
 const marked=state.read.includes(t.id), qs=topicQuestions(t.id), extr=EXTRA[t.id]||[];
 return `<div class="pagehead"><div><button class="textlink" data-view="trilhas">← Voltar para matérias</button><div class="eyebrow">${esc(blockLabel(t.block))} · Aula de revisão</div><h1 class="pageheading">${esc(t.title)}</h1><p class="subtitle">Resumo autoral alinhado aos tópicos do edital • Referências para aprofundar</p></div><button class="btn ${marked?'secondary':''}" data-action="mark-read" data-id="${attr(t.id)}">${marked?'✓ Aula marcada como estudada':'✓ Marcar aula como estudada'}</button></div>
 <div class="lessonlayout"><article class="lessonbody"><h2>O que você precisa dominar</h2><p>${esc(t.summary)}</p>${extr.length?`<h2>Raciocínio para a prova</h2><ol class="lessonextra">${extr.map(v=>`<li>${esc(v)}</li>`).join('')}</ol>`:''}<h2>Fórmulas e relações essenciais</h2><div class="formula">${esc(t.formula)}</div><h2>Exemplo resolvido</h2><div class="example"><strong>Aplicação direta</strong><br>${esc(t.example)}</div><h2>Checklist de domínio</h2><ul class="lessonextra"><li>Sei explicar os termos e as hipóteses sem consultar anotações.</li><li>Consigo aplicar as relações em um exercício numérico simples.</li><li>Sei identificar afirmações incorretas em itens Certo ou Errado.</li></ul><div class="divider"></div><button class="btn" data-action="practice-topic" data-id="${attr(t.id)}" ${!qs.length?'disabled':''}>Responder ${qs.length} questões desta aula →</button></article>
 <aside class="lessonaside"><div class="panel"><h3 style="margin-bottom:10px">Seu progresso</h3><div class="weekline"><div class="lab">Nesta matéria</div><strong>${qs.length} questões</strong><p>${marked?'Aula marcada como estudada':'Ainda não marcada como estudada'}</p></div><h3 style="margin:18px 0 9px">Para aprofundar</h3>${(t.links||[]).map(k=>`<a class="resourcelink" href="${attr(BASE.links[k]||k)}" target="_blank" rel="noopener noreferrer">▧ ${esc(resourceName(k))} ↗</a>`).join('')}<p class="smallmuted" style="line-height:1.7;margin-top:15px">As explicações são resumos originais. Os links levam a livros, cursos ou referências externas; não reproduzimos o texto integral das obras.</p></div></aside></div>`}
function resourceName(key){return {univesp:'UNIVESP',khan:'Khan Academy',mit:'MIT OpenCourseWare',openstax:'OpenStax',bpg:'AAPG — Petroleum Systems',up:'Universidade Petrobras',perfuracao:'Livro: Perfuração Direcional',pressao:'Livro: Testes de Pressão',portugues:'Gramática e português',british:'British Council',ingles:'Inglês — British Council',stat:'Estatística — Khan Academy'}[key]||key}
function questoes(){const tOpts=topics().map(t=>`<option value="${attr(t.id)}" ${qTopic===t.id?'selected':''}>${esc(t.title)}</option>`).join('');const c=questions().filter(q=>(qTopic==='TODOS'||q.topic===qTopic)&&(qDifficulty==='TODOS'||String(q.difficulty)===String(qDifficulty)));

 <div class="columns"><section class="panel"><div class="panelhead"><h3>Adicionar uma questão</h3><span class="chip">Certo / Errado</span></div><form id="addQuestion"><div class="field"><label for="formTopic">Matéria</label><select id="formTopic" name="topic" required>${topics().map(t=>`<option value="${attr(t.id)}">${esc(t.title)}</option>`).join('')}</select></div><div class="field"><label for="formText">Enunciado</label><textarea id="formText" name="text" minlength="10" maxlength="1000" placeholder="Ex.: Para escoamento incompressível..." required></textarea></div><div class="formrow"><div class="field"><label for="formAnswer">Gabarito</label><select id="formAnswer" name="answer"><option value="true">Certo</option><option value="false">Errado</option></select></div><div class="field"><label for="formDiff">Nível</label><select id="formDiff" name="difficulty"><option value="1">Básico</option><option value="2" selected>Intermediário</option><option value="3">Avançado</option></select></div></div><div class="field"><label for="formExplain">Explicação / resolução</label><textarea id="formExplain" name="explanation" minlength="8" maxlength="2000" placeholder="Explique o raciocínio e a fórmula..." required></textarea></div><button class="btn" type="submit" style="width:100%">+ Salvar questão</button></form></section>

function startSession(opts){const source=opts?.source||'all';let pool=source==='errors'?wrong():source==='saved'?questions().filter(q=>state.bookmark.includes(q.id)):questions();if(opts?.topic)pool=pool.filter(q=>q.topic===opts.topic);if(opts?.difficulty)pool=pool.filter(q=>String(q.difficulty)===String(opts.difficulty));if(opts?.single)pool=pool.filter(q=>q.id===opts.single);if(!pool.length){toast('Não há questões disponíveis com esse filtro.');return}
 const items=[...pool].sort(()=>Math.random()-.5).slice(0,opts?.count||pool.length);
 quiz={items,idx:0,answers:[],mode:opts?.mode||'practice',chosen:undefined,startedAt:Date.now()};nav('quiz');}
function currentQuestion(){return quiz?.items?.[quiz.idx]}
function quizView(){if(!quiz)return `<div class="empty">Sem sessão ativa. <button class="btn" data-view="questoes">Voltar ao banco</button></div>`;
 const q=currentQuestion();if(!q)return '<p>Sem questão.</p>';const resp=quiz.chosen, revealed=resp!==undefined && quiz.mode!=='mock', isCorrect=resp===q.answer;
 const chosenText=resp===null?'Em branco':resp===true?'Certo':'Errado';
 return `<div class="quizwrap"><div class="quiztop"><div><div class="eyebrow">${quiz.mode==='mock'?'SIMULADO':'TREINO COMENTADO'}</div><h1 class="pageheading" style="font-size:24px;margin:5px 0">Questão ${quiz.idx+1} de ${quiz.items.length}</h1></div><button class="btn secondary small" data-action="end-quiz">Encerrar sessão ✕</button></div><div class="quizprogress"><div style="width:${Math.round(quiz.idx/quiz.items.length*100)}%"></div></div><div class="qcard"><div class="qmeta"><span><span class="topicbadge">${esc(questionTopic(q.topic))}</span> <span class="chip">${['','Básica','Intermediária','Avançada'][q.difficulty]||'Intermediária'}</span></span><span>${esc(q.id)} · ${quiz.mode==='mock'?'Sem feedback imediato':'Autoral'}</span></div><div class="qtext">${esc(q.text)}</div><div class="choices"><button class="choice ${revealed?(q.answer===true?'correct':(resp===true?'wrong':'')):''}" data-action="answer" data-value="true" ${resp!==undefined?'disabled':''}>✓ &nbsp; Certo</button><button class="choice ${revealed?(q.answer===false?'correct':(resp===false?'wrong':'')):''}" data-action="answer" data-value="false" ${resp!==undefined?'disabled':''}>✕ &nbsp; Errado</button></div>
 ${revealed?`<div class="feedback ${resp===null||isCorrect?'':'bad'}"><strong>${resp===null?'⚪ Você deixou em branco':isCorrect?'✓ Resposta correta':'✕ Resposta incorreta'} · Gabarito: ${q.answer?'Certo':'Errado'}</strong><p>${esc(q.explanation)}</p></div>`:''}
 <div class="qfooter"><div style="display:flex;gap:8px"><button class="btn secondary small" data-action="bookmark" data-id="${attr(q.id)}">${state.bookmark.includes(q.id)?'★ Favorita':'☆ Favoritar'}</button></div><div style="display:flex;gap:9px">${resp===undefined?`<button class="btn outline small" data-action="skip">Deixar em branco</button>`:`<button class="btn small" data-action="next-question">${quiz.idx===quiz.items.length-1?'Ver resultado →':'Próxima questão →'}</button>`}</div></div></div><p class="center smallmuted" style="margin-top:18px">${quiz.mode==='mock'?'No simulado, o gabarito aparece somente no final.':(window.PetroCloud?.isAuthenticated()?'As respostas são salvas automaticamente na sua conta.':'As respostas são salvas automaticamente neste navegador.')}}</p></div>`}
function answerQuiz(val){if(!quiz||quiz.chosen!==undefined)return;quiz.chosen=val;const q=currentQuestion();const correct=val===null?null:val===q.answer;const item={id:q.id,attemptId:window.crypto?.randomUUID?.()||'00000000-0000-4000-8000-'+Math.random().toString(16).slice(2).padEnd(12,'0').slice(0,12),answer:val,correct,date:new Date().toISOString(),mode:quiz.mode};quiz.answers.push(item);state.history.push(item);if(state.history.length>5000)state.history=state.history.slice(-5000);save();window.PetroCloud?.trackAnswer(item);if(quiz.mode==='mock'){nextQuestion()}else render()}

function resultsView(){if(!quiz)return '<p>Não há resultado salvo da sessão atual.</p>';const list=quiz.answers, ac=list.filter(a=>a.correct===true).length, err=list.filter(a=>a.correct===false).length, blank=list.filter(a=>a.answer===null).length, net=ac-err, rate=ac+err?Math.round(100*ac/(ac+err)):0;
 return `<div class="results"><div class="eyebrow">SESSÃO FINALIZADA</div><h1 class="pageheading">Seu resultado está pronto ✦</h1><p class="subtitle">Continue praticando e revise as justificativas abaixo.</p><div class="resultnumber">${net>0?'+':''}${net} <span style="font-size:15px;color:var(--muted)">pontos líquidos</span></div><div class="resultgrid"><div class="resulttile"><strong style="color:var(--green)">${ac}</strong><span>Acertos</span></div><div class="resulttile"><strong style="color:var(--red)">${err}</strong><span>Erros</span></div><div class="resulttile"><strong>${blank}</strong><span>Em branco</span></div></div><p class="smallmuted">Taxa de acerto entre itens respondidos: <strong>${rate}%</strong> · duração aproximada: ${Math.max(1,Math.ceil((Date.now()-quiz.startedAt)/60000))} min</p><div style="display:flex;gap:10px;justify-content:center;margin:23px 0;flex-wrap:wrap"><button class="btn" data-action="start-quick">Novo treino ↗</button><button class="btn secondary" data-view="erros">Caderno de erros</button></div><section class="panel" style="text-align:left"><h3>Correção da sessão</h3>${list.map((r,i)=>{const q=questions().find(x=>x.id===r.id);return !q?'':`<div style="padding:16px 0;border-bottom:1px solid var(--border)"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><b style="font-size:12px">${i+1}. ${esc(questionTopic(q.topic))}</b><span class="chip ${r.answer===null?'':r.correct?'ok':'bad'}">${r.answer===null?'Branco':r.correct?'✓ Acerto':'✕ Erro'}</span></div><p class="small" style="line-height:1.65">${esc(q.text)}</p><p class="smallmuted"><b>Gabarito: ${q.answer?'Certo':'Errado'}</b> · ${esc(q.explanation)}</p></div>`}).join('')}</section></div>`}

async function importJson(file,kind){if(!file)return;try{const imported=JSON.parse(await file.text());if(kind==='content'){
 const ts=Array.isArray(imported.topics)?imported.topics:[];const qs=Array.isArray(imported.questions)?imported.questions:[];if(!ts.length&&!qs.length)throw Error('O JSON precisa ter topics e/ou questions.');
 const existingTopics=new Set(topics().map(t=>t.id));let addedT=0,addedQ=0;
 for(const t of ts){if(t&&typeof t.id==='string'&&typeof t.title==='string'&&typeof t.summary==='string'&&!existingTopics.has(t.id)&&['I','II','III','BÁSICOS'].includes(t.block)){state.customTopics.push({...t,formula:t.formula||'',example:t.example||'',links:Array.isArray(t.links)?t.links:[]});existingTopics.add(t.id);addedT++}}
 const ids=new Set(questions().map(q=>q.id));for(const q of qs){if(q&&typeof q.id==='string'&&typeof q.text==='string'&&typeof q.explanation==='string'&&typeof q.answer==='boolean'&&existingTopics.has(q.topic)&&!ids.has(q.id)){state.customQuestions.push({...q,difficulty:[1,2,3].includes(q.difficulty)?q.difficulty:2,origin:q.origin||'Importada'});ids.add(q.id);addedQ++}}
 save();toast(`Importados: ${addedT} matérias e ${addedQ} questões.`);render();
 }else{if(!imported||!Array.isArray(imported.history)||!Array.isArray(imported.read))throw Error('Arquivo de backup inválido.');if(!confirm('Restaurar este backup? O progresso atual será substituído.'))return;state={...initial,...imported};save();setTheme();nav('dashboard');toast('Backup restaurado com sucesso.')}}catch(e){toast(`Não foi possível importar: ${e.message}`)}}
const selectedCount=()=>Number(document.querySelector('#quizCounts .numchip.selected')?.dataset.count||10);
function handleClick(e){const v=e.target.closest('[data-view]');if(v){nav(v.dataset.view);return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
 switch(a){case 'menu':$('#sidebar').classList.toggle('open');$('#mobileoverlay').classList.toggle('show');break;

window.PetroPrep={version:BASE.metadata.version,getContent:()=>({topics:topics(),questions:questions()}),getProgress:()=>structuredClone(state)};
window.PetroPrepBridge={
